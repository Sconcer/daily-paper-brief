<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7a8699"/>
    </marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1080" height="560" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="40" y="46" font-size="21" font-weight="bold" fill="#17263a">Daily Paper Brief 五阶段流水线架构</text>
  <text x="40" y="70" font-size="12.5" fill="#5b6675">阶段边界不可合并：监控、准备、评审、门禁、投递各自独立，上一阶段的产物是下一阶段的唯一输入</text>

  <!-- ===== 阶段框 ===== -->
  <!-- 1 Monitor -->
  <g filter="url(#soft)">
    <rect x="40" y="96" width="182" height="118" rx="8" fill="#f2f7fc" stroke="#4477AA" stroke-width="1.6"/>
    <rect x="40" y="96" width="182" height="34" rx="8" fill="#4477AA"/>
    <rect x="40" y="114" width="182" height="16" fill="#4477AA"/>
    <text x="54" y="119" font-size="14" font-weight="bold" fill="#FFFFFF">1 · Monitor</text>
  </g>
  <text x="54" y="150" font-size="12.5" font-weight="bold" fill="#2c3e50">监控与选题</text>
  <text x="54" y="169" font-size="10.5" fill="#5b6675" font-family="'SF Mono','Menlo',monospace">arxiv_monitor_phd.py</text>
  <text x="54" y="187" font-size="10.5" fill="#5b6675">评分 · 主题分组 · 每日去重</text>
  <text x="54" y="203" font-size="10.5" fill="#5b6675">冻结当日论文集合</text>

  <!-- 2 Prepare -->
  <g filter="url(#soft)">
    <rect x="246" y="96" width="182" height="118" rx="8" fill="#f2f7fc" stroke="#4477AA" stroke-width="1.6"/>
    <rect x="246" y="96" width="182" height="34" rx="8" fill="#4477AA"/>
    <rect x="246" y="114" width="182" height="16" fill="#4477AA"/>
    <text x="260" y="119" font-size="14" font-weight="bold" fill="#FFFFFF">2 · Prepare</text>
  </g>
  <text x="260" y="150" font-size="12.5" font-weight="bold" fill="#2c3e50">证据准备</text>
  <text x="260" y="169" font-size="10.5" fill="#5b6675" font-family="'SF Mono','Menlo',monospace">pipeline prepare</text>
  <text x="260" y="187" font-size="10.5" fill="#5b6675">PDF · 正文 · 主图 · 来源清单</text>
  <text x="260" y="203" font-size="10.5" fill="#5b6675">写作描述量 · 评审模板</text>

  <!-- 3 Review -->
  <g filter="url(#soft)">
    <rect x="452" y="96" width="182" height="118" rx="8" fill="#fdf6ec" stroke="#D68945" stroke-width="1.6"/>
    <rect x="452" y="96" width="182" height="34" rx="8" fill="#D68945"/>
    <rect x="452" y="114" width="182" height="16" fill="#D68945"/>
    <text x="466" y="119" font-size="14" font-weight="bold" fill="#FFFFFF">3 · Review</text>
  </g>
  <text x="466" y="150" font-size="12.5" font-weight="bold" fill="#2c3e50">结构化评审</text>
  <text x="466" y="169" font-size="10.5" fill="#5b6675" font-family="'SF Mono','Menlo',monospace">OpenClaw 评审批次</text>
  <text x="466" y="187" font-size="10.5" fill="#5b6675">多视角评审 · claim–evidence</text>
  <text x="466" y="203" font-size="10.5" fill="#5b6675">写作信号记分卡</text>

  <!-- 4 Gate -->
  <g filter="url(#soft)">
    <rect x="658" y="96" width="182" height="118" rx="8" fill="#f2f7fc" stroke="#4477AA" stroke-width="1.6"/>
    <rect x="658" y="96" width="182" height="34" rx="8" fill="#4477AA"/>
    <rect x="658" y="114" width="182" height="16" fill="#4477AA"/>
    <text x="672" y="119" font-size="14" font-weight="bold" fill="#FFFFFF">4 · Gate</text>
  </g>
  <text x="672" y="150" font-size="12.5" font-weight="bold" fill="#2c3e50">校验与构建</text>
  <text x="672" y="169" font-size="10.5" fill="#5b6675" font-family="'SF Mono','Menlo',monospace">merge-batches / build</text>
  <text x="672" y="187" font-size="10.5" fill="#5b6675">JSON Schema 逐字段校验</text>
  <text x="672" y="203" font-size="10.5" fill="#5b6675">构建收据 · 贡献图</text>

  <!-- 5 Deliver -->
  <g filter="url(#soft)">
    <rect x="864" y="96" width="182" height="118" rx="8" fill="#f2f7fc" stroke="#4477AA" stroke-width="1.6"/>
    <rect x="864" y="96" width="182" height="34" rx="8" fill="#4477AA"/>
    <rect x="864" y="114" width="182" height="16" fill="#4477AA"/>
    <text x="878" y="119" font-size="14" font-weight="bold" fill="#FFFFFF">5 · Deliver</text>
  </g>
  <text x="878" y="150" font-size="12.5" font-weight="bold" fill="#2c3e50">投递</text>
  <text x="878" y="169" font-size="10.5" fill="#5b6675" font-family="'SF Mono','Menlo',monospace">send_html_to_feishu.py</text>
  <text x="878" y="187" font-size="10.5" fill="#5b6675">收据一致性校验 · 目标群限定</text>
  <text x="878" y="203" font-size="10.5" fill="#5b6675">按内容+目标群幂等发送</text>

  <!-- 阶段间箭头 -->
  <line x1="224" y1="155" x2="242" y2="155" stroke="#7a8699" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="430" y1="155" x2="448" y2="155" stroke="#7a8699" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="636" y1="155" x2="654" y2="155" stroke="#7a8699" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="842" y1="155" x2="860" y2="155" stroke="#7a8699" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ===== 产物条 ===== -->
  <text x="40" y="252" font-size="12.5" font-weight="bold" fill="#17263a">各阶段关键产物</text>

  <g>
    <rect x="40" y="266" width="182" height="96" rx="6" fill="#FAFBFC" stroke="#d7dee7" stroke-width="1"/>
    <text x="54" y="290" font-size="10.5" fill="#2c3e50">· 冻结论文集合</text>
    <text x="54" y="309" font-size="10.5" fill="#2c3e50">· 去重状态</text>
    <text x="54" y="328" font-size="10.5" fill="#2c3e50">· 每日 Markdown</text>
    <text x="54" y="347" font-size="10.5" fill="#2c3e50">· 选题评分明细</text>
  </g>
  <line x1="131" y1="216" x2="131" y2="262" stroke="#c3ccd8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <g>
    <rect x="246" y="266" width="182" height="96" rx="6" fill="#FAFBFC" stroke="#d7dee7" stroke-width="1"/>
    <text x="260" y="290" font-size="10.5" fill="#2c3e50">· 来源清单 manifest</text>
    <text x="260" y="309" font-size="10.5" fill="#2c3e50">· 提取正文与主图</text>
    <text x="260" y="328" font-size="10.5" fill="#2c3e50">· 写作描述指标</text>
    <text x="260" y="347" font-size="10.5" fill="#2c3e50">· 评审批次输入</text>
  </g>
  <line x1="337" y1="216" x2="337" y2="262" stroke="#c3ccd8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <g>
    <rect x="452" y="266" width="182" height="96" rx="6" fill="#FAFBFC" stroke="#e8d9c3" stroke-width="1"/>
    <text x="466" y="290" font-size="10.5" fill="#2c3e50">· 结构化评审批次</text>
    <text x="466" y="309" font-size="10.5" fill="#2c3e50">· 证据位置与反证</text>
    <text x="466" y="328" font-size="10.5" fill="#2c3e50">· 记分卡 0–2 × 8</text>
    <text x="466" y="347" font-size="10.5" fill="#2c3e50">· 覆盖度说明</text>
  </g>
  <line x1="543" y1="216" x2="543" y2="262" stroke="#c3ccd8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <g>
    <rect x="658" y="266" width="182" height="96" rx="6" fill="#FAFBFC" stroke="#d7dee7" stroke-width="1"/>
    <text x="672" y="290" font-size="10.5" fill="#2c3e50">· 完整 reviews.json</text>
    <text x="672" y="309" font-size="10.5" fill="#2c3e50">· 离线 HTML 报告</text>
    <text x="672" y="328" font-size="10.5" fill="#2c3e50">· sha256 构建收据</text>
    <text x="672" y="347" font-size="10.5" fill="#2c3e50">· draw.io / SVG 图</text>
  </g>
  <line x1="749" y1="216" x2="749" y2="262" stroke="#c3ccd8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <g>
    <rect x="864" y="266" width="182" height="96" rx="6" fill="#FAFBFC" stroke="#d7dee7" stroke-width="1"/>
    <text x="878" y="290" font-size="10.5" fill="#2c3e50">· dry-run 校验记录</text>
    <text x="878" y="309" font-size="10.5" fill="#2c3e50">· 飞书附件 ×1</text>
    <text x="878" y="328" font-size="10.5" fill="#2c3e50">· message_id 回执</text>
    <text x="878" y="347" font-size="10.5" fill="#2c3e50">· 幂等发送状态</text>
  </g>
  <line x1="955" y1="216" x2="955" y2="262" stroke="#c3ccd8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- ===== 底部原则条 ===== -->
  <rect x="40" y="396" width="1006" height="108" rx="8" fill="#17263a"/>
  <text x="66" y="426" font-size="13" font-weight="bold" fill="#FFFFFF">终止契约</text>
  <text x="66" y="449" font-size="11.5" fill="#c9d4e2">“Agent 正常返回”≠ 流水线成功。仅两种结束状态：</text>
  <text x="66" y="470" font-size="11.5" fill="#c9d4e2">① 已验证当日无新论文；</text>
  <text x="66" y="491" font-size="11.5" fill="#c9d4e2">② 评审完整 + 构建成功 + dry-run 通过 + 取得 message_id。</text>

  <text x="470" y="426" font-size="13" font-weight="bold" fill="#FFFFFF">信任边界</text>
  <text x="470" y="449" font-size="11.5" fill="#c9d4e2">论文 PDF / HTML / 仓库均视为不可信输入；</text>
  <text x="470" y="470" font-size="11.5" fill="#c9d4e2">凭据仅在收据一致后读取；</text>
  <text x="470" y="491" font-size="11.5" fill="#c9d4e2">dry-run 不接触凭据与网络。</text>

  <text x="800" y="426" font-size="13" font-weight="bold" fill="#FFFFFF">可复现性</text>
  <text x="800" y="449" font-size="11.5" fill="#c9d4e2">确定性阶段可单独重跑；</text>
  <text x="800" y="470" font-size="11.5" fill="#c9d4e2">依赖 hash 锁定；</text>
  <text x="800" y="491" font-size="11.5" fill="#c9d4e2">离线测试不访问 arXiv 与飞书。</text>

  <!-- 图注 -->
  <text x="1046" y="542" text-anchor="end" font-size="10.5" fill="#7F8C8D" font-style="italic">图 1　五阶段流水线架构：蓝色为确定性阶段，橙色为模型评审阶段；各阶段仅以显式产物衔接。</text>
</svg>
